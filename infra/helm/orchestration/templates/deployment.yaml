apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
    spec:
      containers:
        - name: dagster-webserver
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["dg", "dev", "-h", "0.0.0.0"]
