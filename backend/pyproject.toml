[tool.poetry]
name = "recsys-prd-backend"
version = "0.1.0"
description = "Backend API and integration services for the multimodal recommendation platform"
authors = ["emdim"]
readme = "../README.md"
packages = [{ include = "recsys_prd" }]

[tool.poetry.dependencies]
python = "^3.13"
pydantic = "2.10.6"
pydantic-settings = "^2.8.1"
redis = "^4.6.0"
qdrant-client = "^1.17.1"
mlflow = "^3.10.1"
fastapi = "^0.135.3"
uvicorn = "0.34.0"
prometheus-client = "^0.24.1"
confluent-kafka = "^2.13.2"
xgboost = "^3.2.0"
feast = {version = "^0.61.0", extras = ["redis"]}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
ruff = "^0.11.4"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [".", ".."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
