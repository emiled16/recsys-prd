[tool.poetry]
name = "recsys-prd-backend"
version = "0.1.0"
description = "Backend services and pipelines for the multimodal recommendation platform"
authors = ["emdim"]
readme = "../README.md"
packages = [{ include = "recsys_prd" }]

[tool.poetry.dependencies]
python = "^3.13"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
ruff = "^0.11.4"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
